# 轮速里程计 + PX4 EKF2 角速度。只这一份发布 odom -> base_link。
# 不再使用 D435i IMU。wheel_odometry 的 publish_odom_tf 在建图/导航里必须关掉。
ekf_filter_node:
  ros__parameters:
    frequency: 15.0
    sensor_timeout: 0.5
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    publish_tf: true
    publish_acceleration: false
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /wheel_odom
    odom0_config: [true, true, false,
                   false, false, true,
                   true, false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false
    # px4_state_node 把 VehicleOdometry 的 FRD 角速度转到 base_link 的 FLU。
    # 只融合航向角速度，不用没有磁力计的绝对航向。
    imu0: /px4/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
