# 轮速里程计 + D435i 融合 IMU。只这一份发布 odom -> base_link。
# wheel_odometry 的 publish_odom_tf 在建图/导航启动里必须关掉。
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    publish_tf: true
    publish_acceleration: false
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /wheel_odom
    odom0_config: [true, true, false,
                   false, false, true,
                   true, false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false
    # 话题是 unite_imu_method=2 时的 /<namespace>/<camera_name>/imu。
    # 消息类型必须是 sensor_msgs/Imu。只融合航向角速度，不用没有磁力计的绝对航向。
    imu0: /d435i/d435i/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
