# 户外地图 EKF。发布 map -> odom。本地 odom -> base_link 仍用 ekf.yaml，不要改那一份。
# 轮速只融合前进速度。绝对航向来自 /px4/imu（飞控罗盘，已转到 ENU）。
# GPS 笛卡尔坐标来自 navsat 的 /odometry/gps。没有这份数据时滤波仍用轮速和航向，但地图会漂。
ekf_filter_node_map:
  ros__parameters:
    frequency: 15.0
    sensor_timeout: 1.5
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.1
    print_diagnostics: true
    publish_tf: true
    publish_acceleration: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map
    odom0: /wheel_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true, false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false
    odom1: /odometry/gps
    odom1_config: [true, true, false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: false
    odom1_relative: false
    imu0: /px4/imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
