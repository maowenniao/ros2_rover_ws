amcl:
  ros__parameters:
    use_sim_time: false
    scan_topic: /scan
    odom_topic: /odometry/filtered
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    tf_broadcast: true
    min_particles: 500
    max_particles: 3000
    kld_err: 0.05
    update_min_d: 0.1
    update_min_a: 0.1
    resample_interval: 1
    transform_tolerance: 0.5
    laser_min_range: 0.3
    laser_max_range: 12.0
    laser_max_beams: 60

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      max_linear_vel: 0.8
      max_angular_vel: 1.5
      lookahead_distance: 0.6
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

bt_navigator:
  ros__parameters:
    use_sim_time: false
    bt_xml_filename: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_w_recovery.xml"
    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_w_recovery.xml"

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      robot_radius: 0.30
      inflation_layer:
        inflation_radius: 0.55
      obstacle_layer:
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          obstacle_range: 3.0
          raytrace_range: 3.5

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      robot_radius: 0.30
      inflation_layer:
        inflation_radius: 0.6
      obstacle_layer:
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          obstacle_range: 5.0
          raytrace_range: 6.0
