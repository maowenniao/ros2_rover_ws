# ODrive CAN 节点参数。轮径、轮距、方向和速度上限在
# rover_description/config/rover_geometry.yaml，不要在这里再写一份。
odrive_can_node:
  ros__parameters:
    can_interface: socketcan
    can_channel: can0
    can_bitrate: 250000
    # 两块 ODrive V3.6，每块两个轴。按实车改 node id。
    node_ids: [0, 1, 2, 3]
    # /wheel_cmd 下标对应的 node id：左前、左后、右前、右后。
    wheel_cmd_order: [0, 1, 2, 3]
    # /wheel_cmd 超过这个时间没有更新就发 0 turn/s。
    cmd_timeout_sec: 0.2
    cmd_send_rate_hz: 50.0
    encoder_poll_hz: 20.0
    heartbeat_timeout_sec: 1.0
    # MEASURE: 单轴持续电流 (A)。先用较小值，按电机铭牌再加大。
    current_lim: 10.0
